name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      # The tests need no game data.
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal

  publish:
    name: Publish viewer (${{ matrix.runtime }}, framework-dependent)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
    - name: Publish
      run: |
        dotnet publish src/MKWSatellite.App/MKWSatellite.App.csproj -c Release -r ${{ matrix.runtime }} --no-self-contained \
          -o publish/MKWSatellite
        cp README.md LICENSE THIRD_PARTY_NOTICES.md mkwsat.local.example.json publish/MKWSatellite/
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: MKWSatellite-${{ matrix.runtime }}-framework-dependent
        path: publish/MKWSatellite/

  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history and tags, so the notes can list the commits since the previous tag.
        fetch-depth: 0
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
    - name: Build release packages
      # Same packages as a local `pwsh dist/publish.ps1`: self-contained per OS plus the portable one.
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME.TrimStart('v')
        ./dist/publish.ps1 -Version $version
    - name: Write release notes
      # What's changed (commit subjects and messages) and the commit list since the previous v* tag.
      run: bash dist/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > release-notes.md
    - name: Create draft release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        gh release create "$GITHUB_REF_NAME" dist/out/"$version"/* --draft --notes-file release-notes.md --title "MKWSatellite $version"
